<div class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-[#0f172a] relative overflow-hidden transition-colors duration-300">
  <!-- Fondo decorativo -->
  <div class="absolute inset-0 z-0">
    <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-emerald-100 to-slate-50 dark:from-emerald-900/40 dark:to-[#0f172a] pointer-events-none transition-colors duration-300"></div>
    <div class="absolute -top-[30%] -right-[10%] w-[70%] h-[70%] rounded-full bg-emerald-500/20 dark:bg-emerald-500/10 blur-[120px] pointer-events-none transition-colors duration-300"></div>
    <div class="absolute -bottom-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-blue-500/20 dark:bg-blue-500/10 blur-[100px] pointer-events-none transition-colors duration-300"></div>
  </div>

  <div class="z-10 w-full max-w-md p-8 animate-fade-in-up">
    <!-- Card de Cristal -->
    <div class="bg-white/80 dark:bg-slate-900/60 backdrop-blur-xl border border-white/50 dark:border-slate-700/50 rounded-3xl shadow-xl dark:shadow-2xl p-8 transition-colors duration-300">
      
      <!-- Logo y Título -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-400 to-emerald-600 shadow-lg shadow-emerald-500/20 mb-6">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <h1 class="text-3xl font-extrabold text-slate-800 dark:text-white tracking-wide transition-colors">SanPrestamos</h1>
        <p class="text-slate-500 dark:text-slate-400 mt-2 text-sm transition-colors">Inicia sesión para administrar el sistema</p>
      </div>

      <!-- Formulario -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        
        <!-- Error Message -->
        <div *ngIf="errorMessage" class="bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/50 text-red-600 dark:text-red-400 px-4 py-3 rounded-xl text-sm text-center font-medium animate-fade-in-up transition-colors">
          {{ errorMessage }}
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2 transition-colors" for="username">Usuario</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-slate-400 dark:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </div>
            <input id="username" type="text" formControlName="username" 
                   class="block w-full pl-10 pr-3 py-3 border border-slate-200 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-800/50 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-colors" 
                   placeholder="Ingresa tu usuario">
          </div>
          <p *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="text-red-500 dark:text-red-400 text-xs mt-1 transition-colors">El usuario es requerido</p>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2 transition-colors" for="password">Contraseña</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-slate-400 dark:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <input id="password" type="password" formControlName="password" 
                   class="block w-full pl-10 pr-3 py-3 border border-slate-200 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-800/50 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-colors" 
                   placeholder="••••••••">
          </div>
          <p *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-red-500 dark:text-red-400 text-xs mt-1 transition-colors">La contraseña es requerida</p>
        </div>

        <button type="submit" 
                class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-emerald-500/30 text-sm font-bold text-white bg-emerald-500 hover:bg-emerald-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-white dark:focus:ring-offset-slate-900 focus:ring-emerald-500 transition-all duration-200 hover:-translate-y-0.5">
          Ingresar al Sistema
        </button>
      </form>
    </div>
  </div>
</div>
