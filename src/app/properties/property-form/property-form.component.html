<div class="max-w-3xl mx-auto space-y-6 animate-fade-in-up">
  <div class="mb-6 flex items-center text-sm font-medium text-slate-500 dark:text-slate-400">
    <a routerLink="/properties" class="hover:text-emerald-500 dark:hover:text-emerald-400 transition">Propiedades</a>
    <svg class="w-4 h-4 mx-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
    <span class="text-slate-800 dark:text-slate-200">{{ isEditMode ? 'Editar Propiedad' : 'Nueva Propiedad' }}</span>
  </div>

  <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden transition-colors">
    <div class="p-8 border-b border-slate-100 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/50">
      <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100">{{ isEditMode ? 'Editar Propiedad' : 'Añadir Propiedad' }}</h1>
      <p class="text-slate-500 dark:text-slate-400 mt-1">Registra los detalles de la casa o local para alquiler.</p>
    </div>

    <form [formGroup]="propertyForm" (ngSubmit)="onSubmit()" class="p-8 space-y-6">
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">Dirección / Identificador</label>
          <input type="text" formControlName="address" class="w-full px-4 py-2 border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700/50 text-slate-900 dark:text-slate-100 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 focus:bg-white dark:focus:bg-slate-700 transition placeholder-slate-400 dark:placeholder-slate-500" placeholder="Ej. Casa #4, Calle Principal">
          <p *ngIf="propertyForm.get('address')?.invalid && propertyForm.get('address')?.touched" class="text-red-500 dark:text-red-400 text-xs mt-1">La dirección es requerida</p>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">Descripción Breve (Opcional)</label>
          <textarea formControlName="description" rows="2" class="w-full px-4 py-2 border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700/50 text-slate-900 dark:text-slate-100 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 focus:bg-white dark:focus:bg-slate-700 transition placeholder-slate-400 dark:placeholder-slate-500" placeholder="Ej. 2 habitaciones, 1 baño..."></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">Monto de Alquiler (Mensual)</label>
            <div class="relative">
              <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 dark:text-slate-400">$</span>
              <input type="number" formControlName="rentAmount" class="w-full pl-8 pr-4 py-2 border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700/50 text-slate-900 dark:text-slate-100 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 focus:bg-white dark:focus:bg-slate-700 transition placeholder-slate-400 dark:placeholder-slate-500" placeholder="0.00">
            </div>
            <p *ngIf="propertyForm.get('rentAmount')?.invalid && propertyForm.get('rentAmount')?.touched" class="text-red-500 dark:text-red-400 text-xs mt-1">Monto válido requerido</p>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">Estado</label>
            <select formControlName="status" class="w-full px-4 py-2 border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700/50 text-slate-900 dark:text-slate-100 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 focus:bg-white dark:focus:bg-slate-700 transition">
              <option value="available">Disponible (Vacía)</option>
              <option value="rented">Alquilada</option>
            </select>
          </div>
        </div>

        <div *ngIf="propertyForm.get('status')?.value === 'rented'">
          <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">Inquilino (Cliente)</label>
          <select formControlName="tenantId" class="w-full px-4 py-2 border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700/50 text-slate-900 dark:text-slate-100 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 focus:bg-white dark:focus:bg-slate-700 transition">
            <option [ngValue]="null" disabled>Selecciona un cliente</option>
            <option *ngFor="let client of clients$ | async" [value]="client.id">
              {{ client.name }} ({{ client.phone }})
            </option>
          </select>
        </div>
      </div>

      <div class="pt-6 border-t border-slate-100 dark:border-slate-700 flex justify-end space-x-3">
        <button type="button" routerLink="/properties" class="px-5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300 font-medium hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
          Cancelar
        </button>
        <button type="submit" [disabled]="isSubmitting" class="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-medium shadow-lg shadow-emerald-500/30 transition disabled:opacity-50">
          {{ isSubmitting ? 'Guardando...' : 'Guardar Propiedad' }}
        </button>
      </div>
    </form>
  </div>
</div>
